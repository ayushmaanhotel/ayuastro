<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <!-- AyuAstro Text Logo - No Background -->
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#B8960C"/>
      <stop offset="50%" style="stop-color:#D4AF37"/>
      <stop offset="100%" style="stop-color:#F0C14B"/>
    </linearGradient>
    <linearGradient id="brownGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3E2723"/>
      <stop offset="100%" style="stop-color:#5D4037"/>
    </linearGradient>
  </defs>
  <!-- Star sparkle -->
  <circle cx="18" cy="40" r="3" fill="url(#goldGrad)" opacity="0.9"/>
  <circle cx="18" cy="40" r="6" fill="url(#goldGrad)" opacity="0.2"/>
  <!-- "Ayu" text - serif font, bold -->
  <text x="30" y="52" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="bold" fill="url(#brownGrad)" letter-spacing="-1">Ayu</text>
  <!-- "Astro" text - serif font, gold gradient -->
  <text x="142" y="52" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="bold" fill="url(#goldGrad)" letter-spacing="-1">Astro</text>
  <!-- Tagline -->
  <text x="30" y="70" font-family="Inter, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#8D6E63" letter-spacing="3" text-transform="uppercase">NOTHING TO HIDE</text>
</svg>
